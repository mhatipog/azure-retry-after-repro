name: Characterize azure-core Retry-After behavior

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'azure_retry_after_repro.py'
      - '.github/workflows/reproduce-azure-retry.yml'

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install unmodified Microsoft SDK
        run: |
          python -m pip install --disable-pip-version-check 'azure-core==1.41.0'
          python -m pip show azure-core
      - name: Run vendor characterization (no Azure endpoint)
        run: python azure_retry_after_repro.py --output azure-retry-evidence.json
      - name: Upload raw evidence even when prediction differs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-retry-evidence-py${{ matrix.python-version }}
          path: azure-retry-evidence.json
          if-no-files-found: warn
