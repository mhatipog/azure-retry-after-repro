name: Verify proposed Azure SDK fork patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-fork-patch.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - name: Check out reproduction repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check out exact Microsoft fork patch commit (sparse)
        uses: actions/checkout@v4
        with:
          repository: mhatipog/azure-sdk-for-python
          ref: 1bbd45772515939a3147422b05db17ac8a0ccdbd
          path: azure-sdk-src
          sparse-checkout: |
            sdk/core/azure-core
      - name: Install released SDK dependencies and pytest
        run: python -m pip install --disable-pip-version-check 'azure-core==1.41.0' 'pytest>=8,<10'
      - name: Assert imported policy comes from patched fork
        env:
          PYTHONPATH: ${{ github.workspace }}/azure-sdk-src/sdk/core/azure-core
        run: |
          python - <<'PY'
          import azure.core
          print("azure.core package loaded from:", azure.core.__file__)
          assert "azure-sdk-src/sdk/core/azure-core/azure/core" in azure.core.__file__, "Wrong azure-core source under test!"
          PY
      - name: Control - same tests must fail on original published SDK
        env:
          PYTHONPATH: ''
        run: |
          python - <<'PY'
          import azure.core
          print("Unmodified baseline SDK:", azure.core.__file__)
          assert "site-packages" in azure.core.__file__
          PY
          set +e
          python -m pytest --noconftest azure-sdk-src/sdk/core/azure-core/tests/test_retry_after_timeout_budget.py -q --tb=no | tee baseline-failures.txt
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -eq 0 ]; then
            echo "Unexpected: original SDK passed the new regressions"
            exit 1
          fi
          grep -E '12 failed, 4 passed' baseline-failures.txt
      - name: Keep original SDK red-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-sdk-expected-failures-py${{ matrix.python-version }}
          path: baseline-failures.txt
          if-no-files-found: warn
      - name: Check Black formatting of the three proposed upstream files
        run: |
          python -m pip install --disable-pip-version-check 'black>=25,<28'
          python -m black --check --diff --line-length 120 \
            azure-sdk-src/sdk/core/azure-core/azure/core/pipeline/policies/_retry.py \
            azure-sdk-src/sdk/core/azure-core/azure/core/pipeline/policies/_retry_async.py \
            azure-sdk-src/sdk/core/azure-core/tests/test_retry_after_timeout_budget.py
      - name: Run native sync and async regression tests against patched fork
        env:
          PYTHONPATH: ${{ github.workspace }}/azure-sdk-src/sdk/core/azure-core
        run: python -m pytest --noconftest azure-sdk-src/sdk/core/azure-core/tests/test_retry_after_timeout_budget.py -q -ra
